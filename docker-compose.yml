services:
  db:
    build:
      context: ./database
    image: vogelvrij-postgis:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vogelvrij}
      POSTGRES_USER: ${POSTGRES_USER:-vogelvrij}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vogelvrij}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
